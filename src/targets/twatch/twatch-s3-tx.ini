# ------------------------- LilyGO T-Watch S3 (ESP32-S3 + SX1262, 915 MHz) as an ELRS 900 TX -----------------
# twatch-elrs, phase WE1. Not a "Unified_" target: the hardware layout is not in the ExpressLRS/targets repo, so
# python/twatch_layout.py appends targets/twatch/twatch-s3-tx-layout.json (plus the product name and the options
# JSON) to firmware.bin the way python/UnifiedConfiguration.py does for Unified targets.
#
# RADIO_SX127X stays defined: the 900 MHz rate tables, FREQ_STEP/FHSS grid, Lua strings and domain checks are the
# SX127x ones. RADIO_SX1262 swaps the driver (lib/SX127xDriver/SX127xDriver.h -> lib/SX1262Driver).

[env:TWatch_S3_900_TX_via_UART]
extends = env_common_esp32s3tx, radio_SX127X
build_flags =
	${env_common_esp32s3tx.build_flags}
	${radio_SX127X.build_flags}
	-DRADIO_SX1262=1
	-DRegulatory_Domain_FCC_915
	; the radio's supply: AXP2101 ALDO4 = 3.3 V (I2C on the layout's i2c_sda/i2c_scl)
	-DSX1262_POWER_AXP2101_ALDO4
	; DIO3 powers the 1.8 V TCXO, DIO2 drives the RF switch
	-DSX1262_DIO3_TCXO_VOLTAGE=0x02
	-DSX1262_DIO2_RF_SWITCH=1
	; bench without a handset: start transmitting at boot (centred sticks, AUX1 low), Model Match on (model 0)
	-DDEBUG_TX_FREERUN
	-DDEBUG_TX_FREERUN_MODEL_MATCH
	-DDEBUG_TX_FREERUN_RATE=RATE_LORA_900_50HZ
extra_scripts =
	${env_common_esp32.extra_scripts}
	python/twatch_layout.py
custom_twatch_layout = targets/twatch/twatch-s3-tx-layout.json
custom_twatch_product = LilyGO T-Watch S3 900 TX (SX1262)
custom_twatch_lua_name = TWatch S3 900
custom_twatch_binding_phrase = 1991
